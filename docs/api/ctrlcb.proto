  message WorkModeData {
    string option_name = 1; // 末端的名称
    int32  type        = 2; // 末端类型值，风盘为0，顶辐射为1，地暖为2，地冷为3，全空气为4
    bool   is_selected = 3; // 是否被选中,选择才生效，如只选中地暖，该房间只有地暖工作，其他风盘、顶辐射末端将关闭
    bool   is_change   = 4; // 该末端是否支持关闭，目前进全空气末端不允许关闭
  }
  message RoomDetails {
    int64  id                    = 1;  // 房间ID
    string name                  = 2;  // 房间名称
    float  temperature           = 3;  // 房间温度
    float  humidity              = 4;  // 房间湿度
    float  dew_point             = 5;  // 房间露点
    int32  status                = 6;  // 开关机状态
    int32  cl_status             = 7;  // 童锁状态
    int32  mode                  = 8;  // 房间模式 0制冷 1制热 2单通风
    int32  work_status           = 9;  // 工作状态 当为1时表示房间未达标，需要工作，0时表示达标，不需要工作，末端会关闭
    int32  wind_level            = 10; // 当前风机档位，100时为自动风速
    float  temperature_set       = 11; // 设定温度 -1代表无设定温度，例如通风模式
    int32  energy_mode           = 12; // 节能模式 1为节能，处于节能模式时，温度不可设定
    int32  wind_plate_status     = 13; // 风盘状态
    int32  floor_output_status   = 14; // 地面输出状态（地冷暖开关）
    int32  ceiling_output_status = 15; // 顶面输出状态（顶辐射开关）
    int32  min_temperature_set   = 16; // 设定温度最小值(单通风模式为-1)
    int32  max_temperature_set   = 17; // 设定温度最大值(单通风模式为-1)
    repeated WorkModeData end_modes       = 18;
    float                 eco_temperature = 19; // 节能温度，处于节能模式是，显示节能温度
    int32 wind_level_count   = 20; // 风盘风量总级数，部分风速是3级风速，部分是5级风速，也存在10级，100级风速控制的
    bool  is_auto_wind_level = 21; // 是否有自动风速，部分控制面板由自动风速，部分没有，跟该字段判断
    bool  is_connected       = 22; // 是否连接
  }
  repeated RoomDetails rooms = 1;
}

