// 项目报告申请
message ProjectReportQuery {
  string project_id = 1;
  int64  start_time = 2;
  int64  end_time   = 3;
}

message ProjectReportQueryReply {
  float                   total_score       = 1;
  Sensor                  sensor            = 2;
  Room                    room              = 3;
  repeated EnergyStat     build_energy      = 4; // 建筑能效
  OutdoorData             outdoor_data      = 5; // 室外数据

  repeated CommRuntime    air_con_runtime   = 6;  // 空调运行状态
  repeated AirProcRuntime air_proc_runtime  = 7;  // 空气处理机运行状态
  repeated CommRuntime    mix_water_runtime = 8;  // 混水机运行状态
  repeated CommRuntime    room_runtime      = 9;  // 房间运行状态
  float                   trouble_per       = 10; // 故障指数
  repeated ModeRatioDto   mode_ratio        = 11; // 模式占比
  int64                   runtime           = 12; // 运行时长
  int32                   total_rooms       = 13; // 房间总数
  int32                   rated_rooms       = 14; // 评分房间数

  message                 ModeRatioDto {
    int32  mode  = 1;
    float  value = 2;
    string name  = 3;
  }

  message Sensor {
    float            co2_score  = 1; // CO2评分
    float            pm25_score = 2; // PM2.5评分

    // 索引对应关系如下：0->优佳，1->良好，2->正常，3->略高，4->极高
    repeated float   co2_per    = 3; // CO2占比
    repeated float   pm25_per   = 4; // PM2.5占比

    repeated Details details    = 5;

    message          Details {
      int64         id    = 1;
      string        name  = 2; // 名称
      repeated Data datum = 3;

      message       Data {
        int64 date_day = 1; // 日期毫秒值
        int32 avg_co2  = 2; // 平均CO2
        int32 avg_pm25 = 3; // 平均PM2.5
      }
    }
  }

  message OutdoorData {
    float min_temperature = 1;
    float max_temperature = 2;
    float avg_temperature = 3;
    float min_dew_point   = 4;
    float max_dew_point   = 5;
    float avg_dew_point   = 6;
  }

  message CommRuntime {
    string name        = 1; // 名称
    int64  runtime     = 2; // 运行时间(开机时间)
    float  power_ratio = 3; // 开机比例
  }

  message AirProcRuntime {
    string name              = 1; // 名称
    int64  runtime           = 2; // 运行时间(开机时间)
    float  power_ratio       = 3; // 开机比例
    float  compressor_ratio  = 4; // 压缩机开机比例
    float  compressor_freq   = 5; // 压缩机平均频率hz
    float  water_valve_ratio = 6; // 水阀比例
    string strainer_time     = 7; // 滤网更换时间
  }

  message RuntimeStat {
    int64 runtime           = 1; // 运行时间(开机时间)
    float power_ratio       = 2; // 开机比例
    float compressor_ratio  = 3; // 压缩机开机比例
    float compressor_freq   = 4; // 压缩机评价频率hz
    float water_valve_ratio = 5; // 水阀比例
  }

  message Room {
    float            total_score = 1; // 总分
    float            a_per       = 2; // A级得分占比
    float            b_per       = 3; // B级得分占比
    float            c_per       = 4; // C级得分占比
    float            d_per       = 5; // D级得分占比
    repeated Details details     = 6;

    message          Details {
      int64         id          = 1;
      string        name        = 2; // 名称
      repeated Data datum       = 3; // 温湿度数据
      string        time_period = 4; // 时间段
      float         score       = 5; // 评分

      message       Data {
        int64  date_day          = 1; // 日期毫秒值
        string valuation_des     = 2; // 评价汉字描述
        float  temp_deviation    = 3; // 温度偏差
        float  dew_hum_deviation = 4; // 湿度偏差
      }
    }
  }

  message EnergyStat {
    int64                 device_id   = 1; // 设备ID
    string                energy_name = 2; // 能效组合名称
    string                unit        = 3; // 单位
    float                 total_usage = 4; // 总量
    float                 avg_usage   = 5; // 平均量
    repeated EnergyDayDto day_list    = 6; // 每天的用量

    message               EnergyDayDto {
      int64 date  = 1;
      float value = 2;
    }
  }
}

