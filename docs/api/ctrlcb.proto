syntax = "proto3";

package ctrlcb.v1;
option  go_package           = "kxjserver/ctrlcb/api/gen/v1;ctrlcbpb";

option  java_multiple_files  = true;
option  java_package         = "ctrlcb.v1";
option  java_outer_classname = "Ctrlcb";

import "shared/api/shared.proto";
import "google/protobuf/empty.proto";
import "weather/api/weather.proto";

// CtrlCBService 控制屏连接服务
service CtrlCBService {

  rpc Ping(google.protobuf.Empty) returns (google.protobuf.Empty);

  rpc GetStreams(google.protobuf.Empty) returns (GetStreamsResponse);
  // 控制屏发起连接(控制屏端调用)
  rpc OpenStream(OpenStreamRequest) returns (stream CtrlMessage);

  // 控制屏健康检查
  rpc StreamHealthyCheck(StreamHealthyCheckRequest) returns (StreamHealthyCheckResponse);

  // 向控制屏发送消息(外部接口调用)
  rpc PassCtrlMessage(PassCtrlMessageRequest) returns (PassCtrlMessageResponse);

  // 控制屏回调响应数据(控制屏端调用)
  rpc CallbackMessage(CallbackMessageRequest) returns (CallbackMessageResponse);

  // 控制屏发送统计数据
  rpc PutDevicesStat(PutDevicesStatRequest) returns (google.protobuf.Empty);
  rpc PutRoomsStat(PutRoomsStatRequest) returns (google.protobuf.Empty);

  // 获取控制屏存档文件上传地址
  rpc GetDeviceArchiveUploadUrl(GetDeviceArchiveUploadUrlRequest) returns (GetDeviceArchiveUploadUrlResponse);
  // 获取控制屏存档文件下载地址
  rpc GetDeviceArchiveDownloadUrl(GetDeviceArchiveDownloadUrlRequest) returns (GetDeviceArchiveDownloadUrlResponse);
  // 删除控制屏存档文件
  rpc RemoveDeviceArchiveFromOSS(RemoveDeviceArchiveFromOSSRequest) returns (RemoveDeviceArchiveFromOSSResponse);

  // 获取控制屏远程日志文件上传地址
  rpc GetDeviceRemoteLogUploadUrl(GetDeviceRemoteLogUploadUrlRequest) returns (GetDeviceRemoteLogUploadUrlResponse);
  // 获取控制屏远程日志文件下载地址
  rpc GetDeviceRemoteLogDownloadUrl(GetDeviceRemoteLogDownloadUrlRequest)
      returns (GetDeviceRemoteLogDownloadUrlResponse);
  // 删除控制屏远程日志文件
  rpc RemoveDeviceRemoteLogFromOSS(RemoveDeviceRemoteLogFromOSSRequest) returns (RemoveDeviceRemoteLogFromOSSResponse);

  /// 应用相关
  rpc GetLatestAppVersion(GetLatestAppVersionRequest) returns (GetLatestAppVersionResponse);

  /// 项目相关
  // 获取项目信息
  rpc GetProjectInfo(GetProjectInfoRequest) returns (GetProjectInfoResponse);
  // 获取默认项目配置
  rpc GetDefaultProjectConfig(GetDefaultProjectConfigRequest) returns (GetDefaultProjectConfigResponse);
  // 确认获取默认项目配置成功
  rpc ConfirmDefaultProjectConfig(ConfirmDefaultProjectConfigRequest) returns (ConfirmDefaultProjectConfigResponse);
  // 项目交付
  rpc DeliveryProject(DeliveryProjectRequest) returns (google.protobuf.Empty);
  // 项目验收
  rpc AcceptanceProject(AcceptanceProjectRequest) returns (google.protobuf.Empty);
  // 获取项目验收报告上传 URL
  rpc GetAcceptanceReportUploadUrl(GetAcceptanceReportUploadUrlRequest) returns (GetAcceptanceReportUploadUrlResponse);
  // 三恒创建项目信息
  rpc CreateSanHengProject(CreateSanHengProjectRequest) returns (CreateSanHengProjectResponse);
  // 三恒更新项目信息
  rpc UpdateSanHengProject(UpdateSanHengProjectRequest) returns (google.protobuf.Empty);
  // 三恒上传项目配置
  rpc UpdateSanHengProjectConfig(UpdateSanHengProjectConfigRequest) returns (google.protobuf.Empty);
  // 获取项目报告
  rpc GetProjectReports(GetProjectReportsRequest) returns (GetProjectReportsResponse);

  // 获取房屋布局（room list)
  rpc GetHouseLayout(GetHouseLayoutRequest) returns (GetHouseLayoutResponse);

  /// 经销商
  // 获取经销商信息
  rpc GetDistributorInfo(GetDistributorInfoRequest) returns (GetDistributorInfoResponse);

  /// 报警
  // 新建报警信息
  rpc CreateDeviceAlarm(CreateDeviceAlarmRequest) returns (CreateDeviceAlarmResponse);
  rpc StopDeviceAlarm(StopDeviceAlarmRequest) returns (google.protobuf.Empty);
  rpc StopDeviceAlarmByProjectAndContentCode(StopDeviceAlarmByProjectAndContentCodeRequest)
      returns (google.protobuf.Empty);

  /// 控制屏控制参数：模式控制、在家离家控制、修改房间名称、温度控制

  // 控制屏模式信息
  // deprecated
  rpc SaveCtrlModeItem(SaveCtrlModeItemRequest) returns (SaveCtrlModeItemResponse);
  // deprecated
  rpc GetCtrlMode(GetCtrlModeRequest) returns (GetCtrlModeResponse);
  // deprecated
  rpc RemoveCtrlModeItem(RemoveCtrlModeItemRequest) returns (RemoveCtrlModeItemResponse);

  // 控制屏模式控制
  rpc CtrlMode(CtrlModeRequest) returns (PassCtrlMessageResponse);
  // 控制屏在家离家控制
  rpc CtrlHome(CtrlHomeRequest) returns (PassCtrlMessageResponse);
  // 控制屏进行房间名称修改
  rpc CtrlModifyRoomName(CtrlModifyRoomNameRequest) returns (PassCtrlMessageResponse);
  // 控制屏进行房间温度控制
  rpc CtrlRoomTemperature(CtrlRoomTemperatureRequest) returns (PassCtrlMessageResponse);

  // 控制屏消息透传
  rpc TransCtrlMessage(TransCtrlMessageRequest) returns (TransCtrlMessageResponse);
  // 透传消息异步响应
  rpc CallbackTransMessage(CallbackTransMessageRequest) returns (CallbackTransMessageResponse);
  // 查询透传消息响应结果
  rpc GetTransMessageCallback(GetTransMessageCallbackRequest) returns (GetTransMessageCallbackResponse);

  rpc TransCtrlMessageSync(TransCtrlMessageRequest) returns (GetTransMessageCallbackResponse);

  // 群发透传消息
  rpc BroadcastTransMessage(BroadcastTransMessageRequest) returns (BroadcastTransMessageResponse);
  rpc BroadcastCallback(BroadcastCallbackRequest) returns (google.protobuf.Empty);
  // 查询群发消息响应结果
  rpc GetBroadcastResult(GetBroadcastResultRequest) returns (GetBroadcastResultResponse);
  rpc GetBroadcastResultList(GetBroadcastResultListRequest) returns (GetBroadcastResultListResponse);
  // 批量删除群发消息记录
  rpc BatchRemoveBroadcastResult(BatchRemoveBroadcastResultRequest) returns (google.protobuf.Empty);

  // 批量统一控制下发（对每个项目发送 UnifiedCtrlSet，并记录每个项目的执行结果）
  rpc UnifiedCtrlsSend(UnifiedCtrlsSendRequest) returns (UnifiedCtrlsSendResponse);
  // 查询批量统一控制的执行记录
  rpc GetUnifiedCtrlsRecords(GetUnifiedCtrlsRecordsRequest) returns (GetUnifiedCtrlsRecordsResponse);

  // 设置应用版本号
  rpc SetAppVersion(SetAppVersionRequest) returns (google.protobuf.Empty);

  // 设置项目当前模式
  rpc SetProjectMode(SetProjectModeRequest) returns (google.protobuf.Empty);
  // 设置项目滤网寿命
  rpc SetProjectFilterLife(SetProjectFilterLifeRequest) returns (google.protobuf.Empty);

  // 设置项目数据点位总数
  rpc SetProjectDataPointTotal(SetProjectDataPointTotalRequest) returns (google.protobuf.Empty);

  // 上传运行提示
  rpc CreateRunningTip(CreateRunningTipRequest) returns (google.protobuf.Empty);

  rpc GetCalendar(GetCalendarRequest) returns (GetCalendarResponse);

  //  Set project monthly score
  rpc SetProjectMonthlyScore(SetProjectMonthlyScoreRequest) returns (google.protobuf.Empty);

  //
  rpc GetLatestFirmware(GetLatestFirmwareRequest) returns (GetLatestFirmwareResponse);

  rpc GetWeatherByCityCode(GetWeatherByCityCodeRequest) returns (GetWeatherByCityCodeResponse);

  rpc GetVipLevels(GetVipLevelsRequest) returns (GetVipLevelsResponse);
  rpc GetVipServiceByLv(GetVipServiceByLvRequest) returns (GetVipServiceByLvResponse);

  rpc GetAuthProducts(GetAuthProductsRequest) returns (GetAuthProductsResponse);
}

// 串口地址
message SerialPortAddress {
  string type  = 1;
  int32  value = 2;
}

// 房间定期统计数据
message RoomData {
  string project_id  = 1; // 项目 id
  string name        = 2;
  string room_id     = 3;
  int64  timestamp   = 4; // 时间戳（正点，分秒均为0）

  float  temperature = 5;
  float  humidity    = 6;
  float  dew_point   = 7;
  float  co2         = 8;
  float  pm25        = 9;
}

// 其他定期统计数据
message DeviceData {
  float  d1         = 1;
  float  d2         = 2;
  float  d3         = 3;
  float  d4         = 4;
  float  d5         = 5;
  float  d6         = 6;
  float  d7         = 7;
  float  d8         = 8;
  float  d9         = 9;
  float  d10        = 10;

  string project_id = 11; // 项目 id
  string name       = 12; // 名称
  string device_id  = 13;
  int64  timestamp  = 14; // 时间戳（正点，分秒均为0）
}

message PutDevicesStatRequest {
  repeated bytes device_data_list = 1; // 每个 DeviceData marshal 之后得到的数组
}

message PutRoomsStatRequest {
  repeated bytes room_data_list = 2; // 每个 RoomData marshal 之后得到的数组
}

message GetStreamsResponse { repeated string project_ids = 1; }

message OpenStreamRequest { string project_id = 1; }

message StreamHealthyCheckRequest { string project_id = 1; }
message StreamHealthyCheckResponse { bool ok = 1; }

message PassCtrlMessageRequest {
  string      project_id     = 1;
  string      user_id        = 2;
  MessageType message_type   = 3;
  string      body           = 4;
  string      shadow_body    = 5; // 仅用于开发时，前端上传自己期待的结果
  string      device_name    = 6; // 设备 id，如果有需要
  string      parameter_name = 7;
}
message PassCtrlMessageResponse {
  string project_id = 1;
  string request_id = 2;
  string record_id  = 3; // 这次请求（request）会生成一条数据记录，record_id
                         // 即为这条记录的 id, 仅对远程日志等有用。
}

/* A: GRPC接口，直接通过 stream 发到控制屏
 * B: 通过异步回调数据到 Redis
 * C: 类似 A，异步回调数据到内存数据队列
 * D: 控制屏端主动调用接口，数据放到 MQ 队列
 * E: GRPC接口（创建一条存档数据记录（上传中、已完成）），需要 OSS
 * 上传（控制屏统计完毕，通过记录ID获取上传地址）和下载地址接口，提供数据记录CRUD，需要给控制屏提供完成上传接口（用于发送系统通知）
 * F: 提供后端GRPC接口，控制屏端主动调用接口，数据存到
 * MongoDB，需要过期时间的可以存到 Redis
 */

enum MessageType {
  // deprecated, 控制屏信息透传 (A)
  CtrlData                    = 0;
  // 实时房间数据类型 (B)
  CurrentRoom                 = 1;
  // deprecated, use DeviceParameterGet instead
  ProjectConfig               = 2;
  // deprecated, use DeviceDataGet instead
  RealtimeDevice              = 3;
  // 控制屏设备周期性统计数据(比如：间隔 1 个小时传一次数据) (D)
  StatDevice                  = 4;
  // deprecated use DeviceDataCollection instead
  ArchiveDevice               = 5;
  // 滤网数据（？？？）
  StrainerData                = 6;
  // 三恒配置信息（B）
  SH                          = 7;
  // 报警数据（F）
  Alarm                       = 8;
  // 控制屏远程日志（F）
  RemoteLog                   = 9;
  // deprecated,
  // 控制屏当前状态信息（该类型消息的请求，需要控制屏异步响应：有参数则执行，无参数则直接响应数据）（B）
  CurrentCtrl                 = 10;

  DeviceParameterGet          = 11; // 项目设备配置的获取
  DeviceParameterSet          = 12; // 项目设备配置的修改
  SystemParameterGet          = 13; // 项目系统配置的获取
  SystemParameterSet          = 14; // 项目系统配置的修改
  HydraulicSystemGet          = 23; // 水力系统配置的获取
  HydraulicSystemSet          = 22; // 水力系统配置的修改
  AirSystemGet                = 24; // 空气系统配置的获取
  AirSystemSet                = 25; // 空气系统配置的修改

  DeviceDataGet               = 15; // 项目单个设备数据的获取
  DeviceDataFilter            = 16; // 为项目单个数据的设置过滤条件条件
  DeviceDataCollection        = 17; // 项目单个设备数据的按时长收集
  PilotDataCollection         = 32; // 试运行数据收集(实际上是同一个项目多个设备多个参数的数据收集)
  DeviceParamTest             = 36; // 参数监测
  RoomDataGet                 = 40; // 房间数据获取
  RoomStatusGet               = 41; // 房间状态获取
  RoomStatusSet               = 42; // 房间状态设置

  ClientCtrlMode              = 18; // 模式控制
  ClientCtrlHome              = 19; // 在家离家控制
  ClientCtrlTemperature       = 20; // 温度控制
  ClientCtrlRoomName          = 21; // 修改房间名称

  NotiDistributorInfoChanged  = 26; // 经销商信息更改的通知，目前只有 logo 更改才通知

  CtrlGraphicNoticeSend       = 27; // 发送图文通知信息
  CtrlGraphicNoticeCanceled   = 28; // 撤销图文通知信息

  OnlineDeviceList            = 30; // 在线设备列表
  OtherDeviceDataGet          = 31; // 项目的其他设备数据的获取

  DefaultProjectConfigChanged = 33; // 默认项目配置更改的通知
  ProjectDisableAlarm         = 34; // 项目报警禁用
  ProjectEnableAlarm          = 35; // 项目报警启用

  LockSystem                  = 37; // 锁定系统
  UnlockSystem                = 38; // 解锁系统

  Ping                        = 29; // 探活

  ProjectReportGet            = 39; // 项目报告请求

  EnergyDtoGet                = 43; // 能耗数据获取
  AmmeterDataGet              = 44; // 电表数据获取

  FirmwareUpgradeSend         = 45; // 固件升级

  RealtimeDataReply           = 46; // 实时返回

  ScreenUpgradeSend           = 47; // 控制屏升级

  TPSystemModeGet             = 101; // 获取系统模式
  TPSystemModeSet             = 102; // 设置系统模式
  TPSystemIsAtHomeSet         = 103; // 设置系统在家模式
  TPSystemSceneModeSet        = 104; // 设置系统场景模式
  TPFloorRoomGet              = 105; // 获取房间信息
  TPRoomStatusGet             = 106; // 获取房间状态
  TPRoomTemperatureSet        = 107; // 设置房间温度
  TPRoomEndSet                = 108; // 设置房间末端
  TPRoomECOSet                = 109; // 设置房间节能模式
  TPRoomChildLockSet          = 110; // 设置房间儿童锁
  TPRoomWindLevelSet          = 111; // 设置房间风速
  TPRoomStatusSet             = 112; // 设置房间开关
  TPAirSensorGet              = 113; // 获取空气传感器数据
  TPAirSensorDataHourGet      = 114; // 获取空气传感器数据（按小时）
  TPRoomPanelDataHourGet      = 115; // 获取房间面板数据（按小时）
  TPAmmeterDataGet            = 116; // 获取电表数据
  TPAmmeterStatisticGet       = 117; // 获取电表统计数据
  TPTroubleWarnGet            = 118; // 获取故障报警信息
  TPAirFilterGet              = 119; // 获取滤网数据
  TPAirFilterReset            = 120; // 重置滤网数据

  RoomTemperatureDataGet      = 200; // 房间温控数据
  RoomTemperatureSet          = 201; // 房间温控设置
  FreshDehumidifierGet        = 202; // 获取新风除湿机数据
  UnifiedCtrlSet              = 203; // 统一控制设置
  RunningCtrlSet              = 204; // 运行控制设置
  DeviceSummaryGet            = 205; // 设备连接状态
  ProjectRoomSwitchSet        = 206; // 房间开关设置
  AirSensorGet                = 207; // 获取空气传感器数据
  AirSensorDataHourGet        = 208; // 获取空气传感器数据（按小时）
  RoomTemperatureDataHourGet  = 209; // 获取房间温控数据（按小时）
  RunningCtrlGet              = 210; // 获取运行控制数据
}

// CtrlMessage 控制屏消息
message CtrlMessage {
  string      project_id         = 1; // 项目ID
  string      request_id         = 2; // 请求ID
  string      user_id            = 3; // 用户ID
  string      record_id          = 4; // 数据记录ID
  MessageType message_type       = 5; // 消息类型
  string      body               = 6; // 消息请求附带数据
  int32       trans_message_type = 7; // 透传消息类型
  string      open_id            = 8; // 微信open id
}
message CtrlMessageEntity {
  string      id           = 1;
  string      created_at   = 2;
  string      updated_at   = 3;
  string      creator      = 4;
  string      updater      = 5;
  string      project_id   = 6;
  string      request_id   = 7;
  string      user_id      = 8;
  string      record_id    = 9;
  MessageType message_type = 10;
  string      body         = 11;
  string      open_id      = 12;
}

message CallbackMessageRequest {
  string      project_id     = 1;
  string      request_id     = 2;
  string      user_id        = 3;
  string      record_id      = 4;
  MessageType message_type   = 5;
  string      body           = 6;
  string      project_name   = 7;
  string      device_name    = 8;
  string      parameter_name = 9;  // 设备参数名称
  bool        finished       = 10; // 用来标识是否是最后一条数据
}
message CallbackMessageResponse {}

// TransCtrlMessage 控制屏透传消息
message TransCtrlMessage {
  string project_id   = 1;
  int32  message_type = 2; // 消息类型
  string body         = 3; // 消息请求附带数据
}

// 消息透传请求
message TransCtrlMessageRequest {
  string project_id   = 1;
  int32  message_type = 2;
  string body         = 3;
  string open_id      = 4;
  string user_id      = 5;
  string request_id   = 6;
}
message TransCtrlMessageResponse {}

// 透传消息异步响应
message CallbackTransMessageRequest {
  string project_id   = 1;
  int32  message_type = 2;
  string body         = 3;
  string open_id      = 4;
  string user_id      = 5;
  string request_id   = 6;
}
message CallbackTransMessageResponse {}

// 查询透传消息响应结果
message GetTransMessageCallbackRequest {
  string project_id   = 1;
  int32  message_type = 2;
  string open_id      = 3;
  string user_id      = 4;
}
message GetTransMessageCallbackResponse {
  string project_id   = 1;
  int32  message_type = 2;
  string body         = 3;
}

message BroadcastTransMessageRequest {
  string region         = 1;
  string distributor_id = 2;
  string app_id         = 3;
  int32  message_type   = 4;
  string body           = 5;
}
message BroadcastTransMessageResponse { string request_id = 1; }

message BroadcastCallbackRequest {
  string request_id = 1;
  string project_id = 2;
  string body       = 3;
}

message BroadcastResult {
  message Data {
    string project_id = 1;
    string body       = 3;
  }
  string        request_id   = 1;
  string        created_at   = 2;
  string        updated_at   = 3;
  int32         message_type = 4;
  repeated Data data         = 5;
  string        progress     = 6; // 完成进度: 完成数量/总数量
}
message GetBroadcastResultRequest { string request_id = 1; }
message GetBroadcastResultResponse { BroadcastResult result = 1; }

message GetBroadcastResultListRequest { shared.v1.PageOptions page_options = 1; }
message GetBroadcastResultListResponse {
  repeated BroadcastResult result = 1;
  int64                    total  = 2;
}

message BatchRemoveBroadcastResultRequest { repeated string request_ids = 1; }

// 批量统一控制下发请求，message_type 固定为 UnifiedCtrlSet
message UnifiedCtrlsSendRequest {
  repeated string project_ids = 1;
  string          user_id     = 2; // 操作人员 ID
  string          body        = 3; // UnifiedCtrlSetQuery 序列化后的 base64
  string          shadow_body = 4; // 仅用于开发时，前端上传自己期待的结果
}
message UnifiedCtrlsSendResponse {
  string batch_id = 1; // 本次批量下发的批次号
  int32  total    = 2; // 下发的项目总数
}

// 批量统一控制的执行结果
enum UnifiedCtrlResult {
  UNIFIED_CTRL_RESULT_UNKNOWN = 0; // 查询时表示不过滤
  UNIFIED_CTRL_RESULT_PENDING = 1; // 等待控制屏返回
  UNIFIED_CTRL_RESULT_SUCCESS = 2; // 成功
  UNIFIED_CTRL_RESULT_FAILED  = 3; // 失败
  UNIFIED_CTRL_RESULT_TIMEOUT = 4; // 超时
}

message UnifiedCtrlsRecord {
  string            id            = 1;
  string            batch_id      = 2;
  string            project_id    = 3;
  string            project_name  = 4;
  string            project_code  = 5;
  UnifiedCtrlResult result        = 6;
  string            message       = 7; // 失败原因或控制屏返回的 msg
  string            operate_time  = 8; // 操作时间 yyyy-MM-dd HH:mm:ss
  string            operator_id   = 9;
  string            operator_name = 10;
}

message GetUnifiedCtrlsRecordsRequest {
  shared.v1.PageOptions page_options = 1;
  string                batch_id     = 2;
  string                project_id   = 3;
  string                project_name = 4; // 模糊匹配
  string                project_code = 5;
  UnifiedCtrlResult     result       = 6; // UNKNOWN 表示不过滤
  string                operator_id  = 7;
  int64                 start_time   = 8; // 操作时间起，unix 秒，0 表示不限
  int64                 end_time     = 9; // 操作时间止，unix 秒，0 表示不限
}
message GetUnifiedCtrlsRecordsResponse {
  repeated UnifiedCtrlsRecord records = 1;
  int64                       total   = 2;
}

enum DeviceArchiveType {
  DeviceArchiveTypeUnkown = 0;
  Archive                 = 1;
  Filter                  = 2;
  Collection              = 3;
  Pilot                   = 4;
  ParamTest               = 5;
}

// DeviceArchive 设备存档记录
message DeviceArchive {
  string            project_id     = 1;
  string            user_id        = 2;
  string            body           = 3;
  bool              finished       = 4;
  DeviceArchiveType type           = 5;
  string            device_name    = 6;
  string            parameter_name = 7;
}
message DeviceArchiveEntity {
  string            id             = 1;
  string            created_at     = 2;
  string            updated_at     = 3;
  string            creator        = 4;
  string            updater        = 5;
  string            project_id     = 6;
  string            user_id        = 7;
  string            body           = 8;
  bool              finished       = 9;
  DeviceArchiveType type           = 10;
  string            device_name    = 11;
  string            parameter_name = 12;
}

message GetDeviceArchiveUploadUrlRequest {
  string id           = 1;
  string content_type = 2;
}
message GetDeviceArchiveUploadUrlResponse { string url = 1; }
message GetDeviceArchiveDownloadUrlRequest {
  string id           = 1;
  string content_type = 2;
}
message GetDeviceArchiveDownloadUrlResponse { string url = 1; }
message RemoveDeviceArchiveFromOSSRequest { string id = 1; }
message RemoveDeviceArchiveFromOSSResponse {}

// GetDefaultProjectConfig
message GetDefaultProjectConfigRequest { string project_id = 1; }
message GetDefaultProjectConfigResponse {
  string config_id = 1;
  string name      = 12;
  string config    = 10;
  bool   based     = 11;
}

message ConfirmDefaultProjectConfigRequest { string project_id = 1; }
message ConfirmDefaultProjectConfigResponse {}

message GetLatestAppVersionRequest {
  int32 app_code = 1; // 这个 code 在 app 中是 string 类型
}

message GetLatestAppVersionResponse {
  int64  version_number = 1;
  string version_name   = 2;
  string change_log     = 3;
  string download_url   = 4;
}

message GetProjectInfoRequest {
  string code = 1;
  string id   = 2;
}

enum ProjectReportState {
