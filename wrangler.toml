# 恒境云 HVAC IoT demo — static SPA on Workers Static Assets, gated by Basic auth (worker/index.js)
# Deploy: npx wrangler deploy   (build runs automatically)
# Secret: BASIC_PASS — security find-generic-password -s hvac-demo-basic -w | npx wrangler secret put BASIC_PASS
name = "hvac-demo"
main = "worker/index.js"
compatibility_date = "2026-10-01"
workers_dev = false
routes = [ { pattern = "hvac-demo.haoqianglyu.com", custom_domain = true } ]

[build]
command = "npm run build"

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = true

[observability]
enabled = true

[observability.logs]
invocation_logs = false
